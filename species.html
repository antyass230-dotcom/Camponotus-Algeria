<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Espèces — Camponotus Algeria</title>

    <meta
        name="description"
        content="Catalogue scientifique des espèces de Camponotus présentes en Algérie."
    >

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="container nav">

            <a href="index.html" class="logo">
                Camponotus <span>Algeria</span>
            </a>

            <nav>

                <a href="index.html">
                    Accueil
                </a>

                <a href="species.html" class="active">
                    Espèces
                </a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         CONTENU PRINCIPAL
    ====================================================== -->

    <main>


        <!-- =================================================
             BANDEAU DU CATALOGUE
        ================================================== -->

        <section class="catalogue-header">

            <div class="container">

                <p class="eyebrow">
                    CATALOGUE SCIENTIFIQUE
                </p>

                <h1>
                    Espèces de <em>Camponotus</em>
                </h1>

                <p class="catalogue-description">
                    Découvrez les espèces du genre
                    <em>Camponotus</em> documentées en Algérie.
                </p>


                <!-- Recherche -->

                <div class="search-box">

                    <input
                        type="search"
                        id="search"
                        placeholder="Rechercher une espèce..."
                        autocomplete="off"
                    >

                </div>

            </div>

        </section>



        <!-- =================================================
             CATALOGUE
        ================================================== -->

        <section class="section">

            <div class="container">

                <div
                    id="species-grid"
                    class="species-grid"
                >

                    <!--
                        Les cartes des espèces
                        sont générées automatiquement
                        par app.js.
                    -->

                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="container footer-content">

            <div>

                <strong>
                    Camponotus Algeria
                </strong>

                <p>
                    Catalogue scientifique du genre
                    <em>Camponotus</em> en Algérie.
                </p>

            </div>

            <div>

                <p>
                    Projet scientifique — ENSA El Harrach
                </p>

            </div>

        </div>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/app.js"></script>

</body>

</html>
